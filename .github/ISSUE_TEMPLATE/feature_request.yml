name: Feature request
description: Propose a new mode, flag, or integration.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What robotics workflow is this blocking (URDF, MoveIt, Gazebo, digital twin, ...)?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
