version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Open3D publishes no wheels for Python 3.13+ yet; keep the image on 3.12.
      - dependency-name: python
        versions: [">=3.13"]
