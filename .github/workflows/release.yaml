name: Release

# Two ways to release (see RELEASING.md):
#   - Actions tab -> Release -> "Run workflow" on main: releases the version in
#     optimizer/__init__.py and creates the vX.Y.Z tag itself.
#   - Push a vX.Y.Z tag: the tag must match optimizer/__init__.py.
# Either way: test, build, publish to PyPI via Trusted Publishing, GitHub Release.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Open3D system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libx11-6 libudev1 libusb-1.0-0 libidn2-0 libgomp1
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -q

  build:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Determine release tag from optimizer.__version__
        id: version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' optimizer/__init__.py)
          tag="v${version}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "${tag}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match optimizer.__version__ ${version}"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - name: Make README links absolute for PyPI
        run: python .github/scripts/pypi_readme.py "${GITHUB_REPOSITORY}" "${{ steps.version.outputs.tag }}"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-pypi:
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: pypi
      url: https://pypi.org/project/urdf-mesh-optimizer/
    permissions:
      id-token: write  # OIDC token for PyPI Trusted Publishing; no API token stored
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    runs-on: ubuntu-latest
    needs: [build, publish-pypi]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release with changelog notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {grab=1; next}
            grab && /^## \[/ {exit}
            grab {print}
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
          # Creates the tag at this commit when the run was started from main.
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
