name: Deploy demo to Hugging Face

# Publishes the browser GUI to a Hugging Face Space whenever it changes on main.
# One-time setup (repo Settings -> Secrets and variables -> Actions):
#   secret   HF_TOKEN  a Hugging Face access token with write permission
#   variable HF_SPACE  e.g. your-hf-username/urdf-mesh-optimizer

on:
  push:
    branches: [main]
    paths: ["optimizer/**", "examples/gui/**", "space/**", ".github/scripts/deploy_space.py"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: vars.HF_SPACE != ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install huggingface_hub
      - run: python .github/scripts/deploy_space.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
