<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>ros-mesh-preprocessor pipeline</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect width="1200" height="420" rx="14" fill="#0d1117"/>

  <text x="40" y="48" fill="#e6edf3" font-size="22" font-weight="700">Pipeline</text>
  <text x="40" y="74" fill="#8b949e" font-size="14">CAD export in, planner-ready robot description assets out. Every stage maps to one module in optimizer/.</text>

  <!-- Stage 1: input -->
  <g transform="translate(40,120)">
    <rect width="160" height="120" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="80" y="34" text-anchor="middle" fill="#58a6ff" font-size="15" font-weight="700">Raw mesh</text>
    <text x="80" y="60" text-anchor="middle" fill="#e6edf3" font-size="12.5">STL · OBJ · PLY</text>
    <text x="80" y="78" text-anchor="middle" fill="#e6edf3" font-size="12.5">OFF · GLB / glTF</text>
    <text x="80" y="104" text-anchor="middle" fill="#8b949e" font-size="11.5" font-family="monospace">100k–1M+ tris</text>
  </g>

  <!-- Stage 2: clean -->
  <g transform="translate(240,120)">
    <rect width="160" height="120" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="80" y="34" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700">Clean</text>
    <text x="80" y="60" text-anchor="middle" fill="#c9d1d9" font-size="12.5">dedupe vertices</text>
    <text x="80" y="78" text-anchor="middle" fill="#c9d1d9" font-size="12.5">drop degenerate tris</text>
    <text x="80" y="104" text-anchor="middle" fill="#8b949e" font-size="11.5" font-family="monospace">core.clean_mesh</text>
  </g>

  <!-- Stage 3: QEM -->
  <g transform="translate(440,120)">
    <rect width="160" height="120" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="80" y="34" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700">QEM decimation</text>
    <text x="80" y="60" text-anchor="middle" fill="#c9d1d9" font-size="12.5">quadric error</text>
    <text x="80" y="78" text-anchor="middle" fill="#c9d1d9" font-size="12.5">edge collapse</text>
    <text x="80" y="104" text-anchor="middle" fill="#8b949e" font-size="11.5" font-family="monospace">core.simplify_mesh</text>
  </g>

  <!-- Visual / collision branches -->
  <g transform="translate(660,96)">
    <rect width="170" height="72" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="85" y="30" text-anchor="middle" fill="#3fb950" font-size="15" font-weight="700">*_visual.stl</text>
    <text x="85" y="52" text-anchor="middle" fill="#c9d1d9" font-size="12">RViz / Gazebo · ~20k</text>
  </g>
  <g transform="translate(660,192)">
    <rect width="170" height="72" rx="10" fill="#161b22" stroke="#f78166" stroke-width="1.5"/>
    <text x="85" y="30" text-anchor="middle" fill="#f78166" font-size="15" font-weight="700">*_collision.stl</text>
    <text x="85" y="52" text-anchor="middle" fill="#c9d1d9" font-size="12">MoveIt / FCL · ~3k</text>
  </g>

  <!-- URDF -->
  <g transform="translate(870,120)">
    <rect width="130" height="120" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="65" y="34" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700">URDF</text>
    <text x="65" y="60" text-anchor="middle" fill="#c9d1d9" font-size="12.5">&lt;link&gt; with</text>
    <text x="65" y="78" text-anchor="middle" fill="#c9d1d9" font-size="11.5">&lt;visual&gt; + &lt;collision&gt;</text>
    <text x="65" y="104" text-anchor="middle" fill="#8b949e" font-size="11.5" font-family="monospace">urdf_export</text>
  </g>

  <!-- MoveIt check -->
  <g transform="translate(1030,120)">
    <rect width="130" height="120" rx="10" fill="#0f2a17" stroke="#3fb950" stroke-width="1.5"/>
    <text x="65" y="34" text-anchor="middle" fill="#3fb950" font-size="15" font-weight="700">Load check</text>
    <text x="65" y="60" text-anchor="middle" fill="#c9d1d9" font-size="12.5">XML · files ·</text>
    <text x="65" y="78" text-anchor="middle" fill="#c9d1d9" font-size="12.5">tri budget</text>
    <text x="65" y="104" text-anchor="middle" fill="#8b949e" font-size="11.5" font-family="monospace">moveit_check</text>
  </g>

  <!-- arrows -->
  <g stroke="#8b949e" stroke-width="1.8" fill="none" marker-end="url(#arr)">
    <path d="M200,180 L236,180"/>
    <path d="M400,180 L436,180"/>
    <path d="M600,170 C630,170 630,132 656,132"/>
    <path d="M600,190 C630,190 630,228 656,228"/>
    <path d="M830,132 C850,132 850,170 866,170"/>
    <path d="M830,228 C850,228 850,190 866,190"/>
    <path d="M1000,180 L1026,180"/>
  </g>

  <!-- Metrics bar -->
  <g transform="translate(240,300)">
    <rect width="760" height="76" rx="10" fill="#161b22" stroke="#30363d" stroke-dasharray="5 4" stroke-width="1.3"/>
    <text x="24" y="31" fill="#f2cc60" font-size="14.5" font-weight="700">metrics.build_report</text>
    <text x="24" y="55" fill="#c9d1d9" font-size="12.5">triangle count · file size · wall time · symmetric Hausdorff (max / mean / RMS) → JSON report per output, batch_report.json per folder</text>
  </g>
  <g stroke="#f2cc60" stroke-width="1.3" stroke-dasharray="3 3" fill="none">
    <path d="M520,240 L520,300"/>
    <path d="M745,264 L745,300"/>
  </g>

  <text x="1160" y="400" text-anchor="end" fill="#8b949e" font-size="12" font-family="monospace">exit 0 = ready for MoveIt · exit 1 = failed check</text>
</svg>
